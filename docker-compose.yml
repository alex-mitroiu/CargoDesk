# Wires the 4 backend processes together for a self-hosted/single-operator deployment.
# NOT independently verified by actually running in this environment (no Docker available
# here) — see each Dockerfile's own note. Build-test before relying on this, especially the
# volume mounts below (SQLite-file bind mounts are simple but easy to get subtly wrong, and
# there was no way to actually confirm these against a running container).
#
# Secrets use Docker Compose's native `secrets:` mechanism (file-based, mounted at
# /run/secrets/<name> inside each container) rather than plain `environment:` values — a
# secret passed via `environment:` shows up in full in `docker inspect` and any process-env
# dump; a file mounted under /run/secrets does not. Each app process reads it via a
# `<NAME>_FILE` env var pointing at the mounted path (lib/dockerSecret.js and its per-service
# duplicates), falling back to a plain `<NAME>` env var or a dev default if unset — so this
# still works unchanged for `npm run dev` or a plain `docker run -e` with no Compose secrets.
#
# Usage:
#   1. mkdir -p docker-secrets
#      openssl rand -hex 32 > docker-secrets/jwt_secret
#      openssl rand -hex 32 > docker-secrets/distribution_service_secret
#      openssl rand -hex 32 > docker-secrets/pdf_render_service_secret
#      openssl rand -hex 32 > docker-secrets/contract_service_secret
#      openssl rand -hex 32 > docker-secrets/mdm_service_secret
#      openssl rand -hex 32 > docker-secrets/screening_service_secret
#      openssl rand -hex 32 > docker-secrets/kanban_service_secret
#      (docker-secrets/ is gitignored — see .gitignore. These files are the actual secrets;
#      treat them the same as you would a committed .env, i.e. never commit them for real.)
#   2. cp .env.example .env — fills in LOGIN_RATE_MAX and anything else non-secret
#   3. mkdir -p docker-data && touch docker-data/cargodesk.db docker-data/distribution.db docker-data/contracts.db docker-data/mdm.db docker-data/screening.db docker-data/kanban.db
#      (REQUIRED — Docker bind-mounts a host path that doesn't exist yet as a DIRECTORY, not a
#      file, which would break `new DatabaseSync('/app/cargodesk.db')` since it expects a real
#      file path. Creating empty files first sidesteps this well-known bind-mount gotcha.)
#   4. mkdir -p docker-data/uploads
#   5. docker compose up -d --build
#
# The contract-management/mdm/screening/kanban services run ALONGSIDE the monolith's own local
# tables, not in place of them (app_settings.contract_source/mdm_source/screening_source/
# kanban_source, all default 'local') — this compose file starts them either way (cheap,
# stateless-to-add), same as document-distribution/pdf-render; nothing reads from any of them
# until an admin flips the relevant toggle in Application Settings and, before doing so, runs the
# matching `npm run migrate:*-to-service` script (screening's own migration deliberately does not
# carry over sync history — see that script's own header).

secrets:
  jwt_secret:
    file: ./docker-secrets/jwt_secret
  distribution_service_secret:
    file: ./docker-secrets/distribution_service_secret
  pdf_render_service_secret:
    file: ./docker-secrets/pdf_render_service_secret
  contract_service_secret:
    file: ./docker-secrets/contract_service_secret
  mdm_service_secret:
    file: ./docker-secrets/mdm_service_secret
  screening_service_secret:
    file: ./docker-secrets/screening_service_secret
  kanban_service_secret:
    file: ./docker-secrets/kanban_service_secret

services:
  monolith:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      DISTRIBUTION_SERVICE_URL: http://document-distribution:3002
      DISTRIBUTION_SERVICE_SECRET_FILE: /run/secrets/distribution_service_secret
      PDF_RENDER_SERVICE_URL: http://pdf-render:3003
      PDF_RENDER_SERVICE_SECRET_FILE: /run/secrets/pdf_render_service_secret
      CONTRACT_SERVICE_URL: http://contract-management:3004
      CONTRACT_SERVICE_SECRET_FILE: /run/secrets/contract_service_secret
      MDM_SERVICE_URL: http://mdm:3005
      MDM_SERVICE_SECRET_FILE: /run/secrets/mdm_service_secret
      SCREENING_SERVICE_URL: http://screening:3006
      SCREENING_SERVICE_SECRET_FILE: /run/secrets/screening_service_secret
      KANBAN_SERVICE_URL: http://kanban:3007
      KANBAN_SERVICE_SECRET_FILE: /run/secrets/kanban_service_secret
      LOGIN_RATE_MAX: ${LOGIN_RATE_MAX:-20}
    secrets:
      - jwt_secret
      - distribution_service_secret
      - pdf_render_service_secret
      - contract_service_secret
      - mdm_service_secret
      - screening_service_secret
      - kanban_service_secret
    volumes:
      # Bind-mounted to specific host paths deliberately, NOT a named volume mounted over the
      # whole /app directory — that would hide the image's own application code (server.js,
      # dist/, node_modules) behind an empty volume and break the container outright. The host
      # file must already exist (see step 3 above) — its contents don't matter, server.js
      # creates the real schema on first boot, but Docker creates a DIRECTORY at a bind-mount
      # target that doesn't exist yet, which would break DatabaseSync entirely.
      - ./docker-data/cargodesk.db:/app/cargodesk.db
      - ./docker-data/uploads:/app/uploads
    depends_on:
      - document-distribution
      - pdf-render
      - contract-management
      - mdm
      - screening
      - kanban
    restart: unless-stopped

  document-distribution:
    build:
      context: .
      dockerfile: services/document-distribution/Dockerfile
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      DISTRIBUTION_SERVICE_SECRET_FILE: /run/secrets/distribution_service_secret
    secrets:
      - distribution_service_secret
    volumes:
      - ./docker-data/distribution.db:/app/services/document-distribution/distribution.db
    restart: unless-stopped

  pdf-render:
    build:
      context: .
      dockerfile: services/pdf-render/Dockerfile
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: production
      PDF_RENDER_SERVICE_SECRET_FILE: /run/secrets/pdf_render_service_secret
    secrets:
      - pdf_render_service_secret
    restart: unless-stopped

  contract-management:
    build:
      context: .
      dockerfile: services/contract-management/Dockerfile
    ports:
      - "3004:3004"
    environment:
      NODE_ENV: production
      CONTRACT_SERVICE_SECRET_FILE: /run/secrets/contract_service_secret
    secrets:
      - contract_service_secret
    volumes:
      - ./docker-data/contracts.db:/app/services/contract-management/contracts.db
    restart: unless-stopped

  mdm:
    build:
      context: .
      dockerfile: services/mdm/Dockerfile
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: production
      MDM_SERVICE_SECRET_FILE: /run/secrets/mdm_service_secret
    secrets:
      - mdm_service_secret
    volumes:
      - ./docker-data/mdm.db:/app/services/mdm/mdm.db
    restart: unless-stopped

  screening:
    build:
      context: .
      dockerfile: services/screening/Dockerfile
    ports:
      - "3006:3006"
    environment:
      NODE_ENV: production
      SCREENING_SERVICE_SECRET_FILE: /run/secrets/screening_service_secret
    secrets:
      - screening_service_secret
    volumes:
      - ./docker-data/screening.db:/app/services/screening/screening.db
    restart: unless-stopped

  kanban:
    build:
      context: .
      dockerfile: services/kanban/Dockerfile
    ports:
      - "3007:3007"
    environment:
      NODE_ENV: production
      KANBAN_SERVICE_SECRET_FILE: /run/secrets/kanban_service_secret
    secrets:
      - kanban_service_secret
    volumes:
      - ./docker-data/kanban.db:/app/services/kanban/kanban.db
    restart: unless-stopped
