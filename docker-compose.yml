# Wires all 8 processes (the monolith + 7 microservices) together for a self-hosted/single-operator deployment.
# Verified for real on 2026-09-21 (Docker Desktop 4.91 / WSL2, v0.91.6): all 8 images build, `docker compose up`
# brings the whole stack up on the embedded pglite databases, the monolith's /api/health reports all 7 services
# reachable, pdf-render renders a real PDF through its in-container Chromium, and `docker compose down` stops it.
# NOT verified: running against a real Postgres (the *_DATABASE_URL vars below), an orchestrator, or the
# authenticated monolith -> service calls that only start once an admin flips an app_settings.*_source toggle.
# (On a network that re-signs TLS, such as antivirus HTTPS scanning, `npm ci` fails inside every build. Every
# Dockerfile here has the same optional extra-CA build-secret hook — see the root Dockerfile's note — but
# `docker compose build` does NOT pass it. Build each image by hand with `docker build --secret
# id=extra_ca,src=docker-secrets/extra_ca.crt -f <Dockerfile> -t cargodesk-<name> .`, then `docker compose up -d`
# WITHOUT --build: compose's default image names (cargodesk-<service>) match those tags.)
#
# Secrets use Docker Compose's native `secrets:` mechanism (file-based, mounted at
# /run/secrets/<name> inside each container) rather than plain `environment:` values — a
# secret passed via `environment:` shows up in full in `docker inspect` and any process-env
# dump; a file mounted under /run/secrets does not. Each app process reads it via a
# `<NAME>_FILE` env var pointing at the mounted path (lib/dockerSecret.js and its per-service
# duplicates), falling back to a plain `<NAME>` env var or a dev default if unset — so this
# still works unchanged for `npm run dev` or a plain `docker run -e` with no Compose secrets.
#
# Usage:
#   1. mkdir -p docker-secrets
#      openssl rand -hex 32 > docker-secrets/jwt_secret
#      openssl rand -hex 32 > docker-secrets/distribution_service_secret
#      openssl rand -hex 32 > docker-secrets/pdf_render_service_secret
#      openssl rand -hex 32 > docker-secrets/contract_service_secret
#      openssl rand -hex 32 > docker-secrets/mdm_service_secret
#      openssl rand -hex 32 > docker-secrets/screening_service_secret
#      openssl rand -hex 32 > docker-secrets/kanban_service_secret
#      openssl rand -hex 32 > docker-secrets/customer_service_secret
#      (docker-secrets/ is gitignored — see .gitignore. These files are the actual secrets;
#      treat them the same as you would a committed .env, i.e. never commit them for real.)
#   2. cp .env.example .env — fills in LOGIN_RATE_MAX and anything else non-secret
#   3. mkdir -p docker-data/uploads
#      (The monolith and all 6 microservices are Postgres-backed now, ARCHITECTURE.md §13 — none
#      of them uses a SQLite file any more, so there's no bind-mount-target-file to pre-create the
#      way earlier drafts of this file needed. Left unset, DATABASE_URL below, each falls back to
#      an embedded @electric-sql/pglite instance with no volume backing it, so data would not
#      survive a container recreation — see each service's own comment below.)
#   4. docker compose up -d --build
#
# The contract-management/mdm/screening/kanban/customers services run ALONGSIDE the monolith's own
# local tables, not in place of them (app_settings.contract_source/mdm_source/screening_source/
# kanban_source/customer_source, all default 'local') — this compose file starts them either way (cheap,
# stateless-to-add), same as document-distribution/pdf-render; nothing reads from any of them
# until an admin flips the relevant toggle in Application Settings and, before doing so, runs the
# matching `npm run migrate:*-to-service` script (screening's own migration deliberately does not
# carry over sync history — see that script's own header).

secrets:
  jwt_secret:
    file: ./docker-secrets/jwt_secret
  distribution_service_secret:
    file: ./docker-secrets/distribution_service_secret
  pdf_render_service_secret:
    file: ./docker-secrets/pdf_render_service_secret
  contract_service_secret:
    file: ./docker-secrets/contract_service_secret
  mdm_service_secret:
    file: ./docker-secrets/mdm_service_secret
  screening_service_secret:
    file: ./docker-secrets/screening_service_secret
  kanban_service_secret:
    file: ./docker-secrets/kanban_service_secret
  customer_service_secret:
    file: ./docker-secrets/customer_service_secret

services:
  monolith:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      DISTRIBUTION_SERVICE_URL: http://document-distribution:3002
      DISTRIBUTION_SERVICE_SECRET_FILE: /run/secrets/distribution_service_secret
      PDF_RENDER_SERVICE_URL: http://pdf-render:3003
      PDF_RENDER_SERVICE_SECRET_FILE: /run/secrets/pdf_render_service_secret
      CONTRACT_SERVICE_URL: http://contract-management:3004
      CONTRACT_SERVICE_SECRET_FILE: /run/secrets/contract_service_secret
      MDM_SERVICE_URL: http://mdm:3005
      MDM_SERVICE_SECRET_FILE: /run/secrets/mdm_service_secret
      SCREENING_SERVICE_URL: http://screening:3006
      SCREENING_SERVICE_SECRET_FILE: /run/secrets/screening_service_secret
      KANBAN_SERVICE_URL: http://kanban:3007
      KANBAN_SERVICE_SECRET_FILE: /run/secrets/kanban_service_secret
      CUSTOMER_SERVICE_URL: http://customers:3008
      CUSTOMER_SERVICE_SECRET_FILE: /run/secrets/customer_service_secret
      LOGIN_RATE_MAX: ${LOGIN_RATE_MAX:-20}
      # Postgres-backed via lib/db.js (ARCHITECTURE.md §13). Set MONOLITH_DATABASE_URL in .env to a
      # real Postgres instance. Left empty (the default), falls back to an embedded
      # @electric-sql/pglite instance writing to /app/pgdata inside the container, with no volume
      # backing it below, so data would not survive a container recreation — fine for a quick local
      # compose-up, not a real deployment. Same pattern for every service below.
      DATABASE_URL: ${MONOLITH_DATABASE_URL:-}
      # The first admin account seedAdmin() creates on a fresh database. Left empty it is the PUBLISHED
      # default admin@cargodesk.com / admin123 — set both in .env for anything reachable by anyone else.
      # (NODE_ENV=production also names ADMIN_EMAIL as the SSO break-glass account. The test-fixture admin is
      # never created in production; see seedTestFixtureAdmin in server.js.)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    secrets:
      - jwt_secret
      - distribution_service_secret
      - pdf_render_service_secret
      - contract_service_secret
      - mdm_service_secret
      - screening_service_secret
      - kanban_service_secret
      - customer_service_secret
    volumes:
      # Bind-mounted to a specific host path deliberately, NOT a named volume mounted over the
      # whole /app directory — that would hide the image's own application code (server.js,
      # dist/, node_modules) behind an empty volume and break the container outright.
      - ./docker-data/uploads:/app/uploads
    depends_on:
      - document-distribution
      - pdf-render
      - contract-management
      - mdm
      - screening
      - kanban
      - customers
    restart: unless-stopped

  document-distribution:
    build:
      context: .
      dockerfile: services/document-distribution/Dockerfile
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      DISTRIBUTION_SERVICE_SECRET_FILE: /run/secrets/distribution_service_secret
      # Migrated to Postgres (ARCHITECTURE.md §13, Phase 0) — set the matching *_DATABASE_URL in .env to a real Postgres
      # instance. Left unset, the service falls back to an embedded @electric-sql/pglite instance
      # with no volume backing it below, so its data would not survive a container recreation —
      # fine for a quick local compose-up, not a real production setup.
      DATABASE_URL: ${DISTRIBUTION_DATABASE_URL:-}
    secrets:
      - distribution_service_secret
    restart: unless-stopped

  pdf-render:
    build:
      context: .
      dockerfile: services/pdf-render/Dockerfile
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: production
      PDF_RENDER_SERVICE_SECRET_FILE: /run/secrets/pdf_render_service_secret
    secrets:
      - pdf_render_service_secret
    restart: unless-stopped

  contract-management:
    build:
      context: .
      dockerfile: services/contract-management/Dockerfile
    ports:
      - "3004:3004"
    environment:
      NODE_ENV: production
      CONTRACT_SERVICE_SECRET_FILE: /run/secrets/contract_service_secret
      # Migrated to Postgres (ARCHITECTURE.md §13, Phase 4) — set the matching *_DATABASE_URL in .env to a real Postgres
      # instance. Left unset, falls back to an embedded @electric-sql/pglite instance with no
      # volume backing it below, so data would not survive a container recreation.
      DATABASE_URL: ${CONTRACTS_DATABASE_URL:-}
    secrets:
      - contract_service_secret
    restart: unless-stopped

  mdm:
    build:
      context: .
      dockerfile: services/mdm/Dockerfile
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: production
      MDM_SERVICE_SECRET_FILE: /run/secrets/mdm_service_secret
      # Migrated to Postgres (ARCHITECTURE.md §13, Phase 5, the last microservice phase) — set the
      # matching *_DATABASE_URL in .env to a real Postgres instance. Left unset, falls back to an embedded
      # @electric-sql/pglite instance with no volume backing it below, so data would not survive
      # a container recreation.
      DATABASE_URL: ${MDM_DATABASE_URL:-}
    secrets:
      - mdm_service_secret
    restart: unless-stopped

  screening:
    build:
      context: .
      dockerfile: services/screening/Dockerfile
    ports:
      - "3006:3006"
    environment:
      NODE_ENV: production
      SCREENING_SERVICE_SECRET_FILE: /run/secrets/screening_service_secret
      # Migrated to Postgres (ARCHITECTURE.md §13, Phase 1) — set the matching *_DATABASE_URL in .env to a real Postgres
      # instance. Left unset, falls back to an embedded @electric-sql/pglite instance with no
      # volume backing it below, so data would not survive a container recreation.
      DATABASE_URL: ${SCREENING_DATABASE_URL:-}
    secrets:
      - screening_service_secret
    restart: unless-stopped

  kanban:
    build:
      context: .
      dockerfile: services/kanban/Dockerfile
    ports:
      - "3007:3007"
    environment:
      NODE_ENV: production
      KANBAN_SERVICE_SECRET_FILE: /run/secrets/kanban_service_secret
      # Migrated to Postgres (ARCHITECTURE.md §13, Phase 3) — set the matching *_DATABASE_URL in .env to a real Postgres
      # instance. Left unset, falls back to an embedded @electric-sql/pglite instance with no
      # volume backing it below, so data would not survive a container recreation.
      DATABASE_URL: ${KANBAN_DATABASE_URL:-}
    secrets:
      - kanban_service_secret
    restart: unless-stopped

  customers:
    build:
      context: .
      dockerfile: services/customers/Dockerfile
    ports:
      - "3008:3008"
    environment:
      NODE_ENV: production
      CUSTOMER_SERVICE_SECRET_FILE: /run/secrets/customer_service_secret
      # Migrated to Postgres (ARCHITECTURE.md §13, Phase 2) — set the matching *_DATABASE_URL in .env to a real Postgres
      # instance. Left unset, falls back to an embedded @electric-sql/pglite instance with no
      # volume backing it below, so data would not survive a container recreation.
      DATABASE_URL: ${CUSTOMERS_DATABASE_URL:-}
    secrets:
      - customer_service_secret
    restart: unless-stopped
