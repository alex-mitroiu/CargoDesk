name: Cypress E2E

on:
  pull_request:
    branches: [main]

jobs:
  cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Seed database
        run: npm run seed
        env:
          NODE_ENV: test

      - name: Start dev server (background)
        run: npm run dev &
        env:
          NODE_ENV: test

      - name: Wait for API server (port 3001)
        run: npx wait-on http://localhost:3001/api/health --timeout 60000

      - name: Wait for Vite (port 5173)
        run: npx wait-on http://localhost:5173 --timeout 60000

      - name: Run Cypress
        run: npx cypress run --browser chrome
        env:
          CYPRESS_BASE_URL: http://localhost:5173

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 7

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          retention-days: 7
