name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # No running server needed at all — component tests mock ./api entirely (see
      # src/App.test.jsx's own comment on why). Runs fully in parallel with the other two jobs.
      - name: Run frontend component tests
        run: npm run test:frontend

  backend-tests-and-build:
    runs-on: ubuntu-latest
    # Briefly bumped to 25 while chasing a real CI cancellation — misdiagnosed at first as this
    # job being genuinely too slow post-Postgres-migration. It wasn't: scripts/import-mdm-data.js's
    # main() never called process.exit(0) on success, so its pglite connection kept the process
    # alive indefinitely after printing its last line — the "Seed database" step's own script had
    # already finished, the job just never got control back until the outer timeout fired. Fixed
    # at the source (import-mdm-data.js now calls close()+process.exit(0)); reverted back to 15
    # rather than leave padding around a bug that no longer exists.
    timeout-minutes: 15
    env:
      NODE_ENV: test
      # 29 test files each log in once against one continuous server process — well past the
      # real-world default of 20 per 15 minutes. See routes/auth.js's own comment on this var.
      LOGIN_RATE_MAX: '200'
      # Same class of problem, shorter fuse: several test files (carrier-booking, document-signing,
      # invoice-reversal, workflow-improvements, ...) generate shipment documents, and the real-world
      # default of 20 per 60 seconds (routes/shipment-ops.js) is exhausted well before the suite
      # finishes when they all run back-to-back against one continuous server process.
      DOC_ACTION_RATE_MAX: '500'
      # Same class again: the real-world default is 15 per 5 minutes (routes/export.js) — fine for
      # a human clicking Export occasionally, tight for export.test.js's own CSV/XLSX/template
      # assertions run back-to-back in one continuous process.
      EXPORT_RATE_MAX: '200'
      # Same class again: ai-document-extraction.test.js and ai-agent-gating.test.js between them
      # make 15+ calls to POST /api/ai/extract-document (real-world default: 15 per 15 minutes,
      # routes/ai.js) against one continuous process — exhausted before either file finishes.
      AI_EXTRACT_RATE_MAX: '200'
      AI_CHAT_RATE_MAX: '200'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start monolith + document-distribution + pdf-render + contract-management services (background)
        run: npm run server & npm run distribution-service & npm run pdf-render-service & npm run contract-service &

      - name: Wait for monolith API (port 3001)
        run: npx wait-on http://localhost:3001/api/health --timeout 60000

      - name: Wait for document-distribution service (port 3002)
        run: npx wait-on http://localhost:3002/health --timeout 60000

      - name: Wait for pdf-render service (port 3003)
        run: npx wait-on http://localhost:3003/health --timeout 60000

      - name: Wait for contract-management service (port 3004)
        run: npx wait-on http://localhost:3004/health --timeout 60000

      # import-mdm-data.js requires cargodesk.db to already exist (created by the server on
      # boot, above) — it exits early otherwise. Must run after the server is up, not before.
      - name: Seed database
        run: npm run seed

      # Same class of staleness the cypress job below already had to fix, for the same reason:
      # the monolith caches port->country and port->trade-lane resolution in memory
      # (portCountryMap/portLanesMap, both built exactly once at startup) — rows the seed step
      # above just inserted directly into SQLite are invisible to the already-running process
      # until it restarts and rebuilds those caches from scratch. Found via a real CI failure:
      # reports.test.js's groupBy=country/region assertions (NLRTM -> country NL) came back
      # empty even though the seeded port row was genuinely there — reproduced locally by
      # booting the monolith against a genuinely fresh DB, seeding after boot with no restart
      # (matching this exact step order), and confirming the same 3 assertions fail; restarting
      # before testing fixed it. Only the monolith needs this — the 3 auxiliary services own no
      # port/country/trade-lane data of their own.
      - name: Restart monolith to pick up freshly-seeded MDM caches
        run: |
          (fuser -k 3001/tcp || true) 2>/dev/null
          (lsof -ti:3001 | xargs -r kill -9 || true) 2>/dev/null
          npx wait-on --reverse http://localhost:3001/api/health --timeout 15000 || true
          npm run server &
          npx wait-on http://localhost:3001/api/health --timeout 60000

      - name: Run monolith test suite (45 files)
        run: npm test

      - name: Run document-distribution service test suite
        run: npm run test:distribution-service

      - name: Run monolith-side document-distribution proxy tests
        run: npm run test:document-distribution

      - name: Run contract-management service test suite
        run: npm run test:contract-service

      - name: Run monolith-side contract_source toggle tests
        run: npm run test:contract-service-toggle

      - name: Production build
        run: npm run build

  cypress:
    runs-on: ubuntu-latest
    # Same misdiagnosis and revert as backend-tests-and-build (see that job's comment) — briefly
    # 30, back to 20 now that the real bug (import-mdm-data.js's process never exiting) is fixed
    # at the source rather than padded around.
    timeout-minutes: 20
    env:
      NODE_ENV: test
      # Cypress logs in repeatedly across specs against one continuous server process — see
      # the backend-tests-and-build job's own comment, and routes/auth.js, for why.
      LOGIN_RATE_MAX: '200'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start dev server (background)
        run: npm run dev &

      - name: Wait for API server (port 3001)
        run: npx wait-on http://localhost:3001/api/health --timeout 60000

      - name: Wait for document-distribution service (port 3002)
        run: npx wait-on http://localhost:3002/health --timeout 60000

      - name: Wait for pdf-render service (port 3003)
        run: npx wait-on http://localhost:3003/health --timeout 60000

      - name: Wait for contract-management service (port 3004)
        run: npx wait-on http://localhost:3004/health --timeout 60000

      - name: Wait for Vite (port 5173)
        run: npx wait-on http://localhost:5173 --timeout 60000

      # import-mdm-data.js requires cargodesk.db to already exist (created by the server on
      # boot, above) — it exits early otherwise. Must run after the server is up, not before.
      - name: Seed database
        run: npm run seed

      # The monolith caches port->trade-lane resolution in memory (portLanesMap,
      # rebuildPortLanesMap()) exactly once at startup — country_trade_lanes rows the seed
      # step above just inserted directly into SQLite are invisible to the already-running
      # process until it restarts and rebuilds that cache from scratch. Found via a real CI
      # failure: transit-suggestion.cy.js's lane lookups stayed null even though the DB row
      # was genuinely there. Only the monolith needs this — the 3 auxiliary services own no
      # trade-lane data of their own.
      - name: Restart monolith to pick up freshly-seeded MDM caches
        run: |
          (fuser -k 3001/tcp || true) 2>/dev/null
          (lsof -ti:3001 | xargs -r kill -9 || true) 2>/dev/null
          npx wait-on --reverse http://localhost:3001/api/health --timeout 15000 || true
          npm run server &
          npx wait-on http://localhost:3001/api/health --timeout 60000

      - name: Run Cypress
        run: npx cypress run --browser chrome
        env:
          CYPRESS_BASE_URL: http://localhost:5173

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 7

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          retention-days: 7
